<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Test Page</title>
  </head>
  <body>
    <div id="top" role="document">
        <h1>HTML5 Test Page</h1>
        <p>This is a test page filled with common HTML elements to be used to provide visual feedback whilst building CSS systems and frameworks.</p>
        <input id="button01" onclick="getDeviceInfo()" type="button" value="从鸿蒙终端获取设备信息">
        <textarea id="textarea01" rows="8" cols="48" placeholder="设备信息将显示在这里"></textarea>
        <input id="button02" type="button" value="将H5文本框的内容显示到鸿蒙终端">
        <textarea id="textarea02" rows="8" cols="48" placeholder="输入要发送到鸿蒙的消息"></textarea>
        <br><br>
        <input id="button03" type="button" value="测试JSBridge连接">
        <div id="result"></div>
        
        <hr style="margin: 20px 0; border: 1px solid #ccc;">
        
        <h2>电话号码拨号功能</h2>
        <div style="margin: 20px 0; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
            <div style="margin-bottom: 15px;">
                <label for="phoneNumber" style="display: block; margin-bottom: 8px; font-weight: bold;">电话号码:</label>
                <input type="tel" id="phoneNumber" placeholder="请输入电话号码，例如：13800138000" 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px;">
                <div style="margin-top: 5px; font-size: 12px; color: #666;">
                    支持格式：手机号（11位）、座机号（区号+号码）、国际号码（+86开头）
                </div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <input id="validatePhoneBtn" type="button" value="验证电话号码" 
                       style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                <input id="dialPhoneBtn" type="button" value="拨打电话" 
                       style="flex: 1; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
            </div>
            
            <div id="phoneResult" style="margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background-color: white; min-height: 40px;"></div>
        </div>
    </div>
    <script>
      // JSBridge功能测试
      function testJSBridge() {
        try {
          if (window.harmonyBridge && typeof window.harmonyBridge.testMethod === 'function') {
            const result = window.harmonyBridge.testMethod();
            showResult('JSBridge连接测试成功: ' + result);
          } else {
            showResult('错误: JSBridge未注册或testMethod方法不可用');
            console.log('window.harmonyBridge:', window.harmonyBridge);
            console.log('typeof window.harmonyBridge.testMethod:', typeof window.harmonyBridge?.testMethod);
          }
        } catch (error) {
          showResult('JSBridge调用失败: ' + error.message);
          console.error('JSBridge调用错误:', error);
        }
      }

      // 获取设备信息
      function getDeviceInfo() {
        if (window.harmonyBridge && typeof window.harmonyBridge.getDeviceInfo === 'function') {
          try {
            const deviceInfo = window.harmonyBridge.getDeviceInfo();
            console.log('设备信息:', deviceInfo);
            showResult(deviceInfo);
            // 将设备信息格式化并显示在 textarea01 中
            const textarea01 = document.getElementById('textarea01');
            if (textarea01) {
              const formattedInfo = JSON.stringify(deviceInfo, null, 2);
              textarea01.value = formattedInfo;
              showResult('设备信息已获取并显示在文本框中');
            } else {
              showResult('未找到文本框 textarea01');
            }
          } catch (error) {
            console.error('获取设备信息失败:', error);
            showResult('获取设备信息失败: ' + error.message);
          }
        } else {
          showResult('harmonyBridge.getDeviceInfo 方法不可用');
        }
      }

      // 显示鸿蒙提示
      function showHarmonyToast() {
        try {
          if (window.harmonyBridge && typeof window.harmonyBridge.showToast === 'function') {
            window.harmonyBridge.showToast('这是来自H5页面的提示消息！');
            showResult('提示消息已发送到鸿蒙终端');
          } else {
            showResult('错误: JSBridge未注册或showToast方法不可用');
          }
        } catch (error) {
          showResult('显示提示失败: ' + error.message);
        }
      }

      // 显示自定义提示
      function showCustomToast() {
        const message = document.getElementById('toastMessage').value;
        if (!message) {
          showResult('请输入提示消息');
          return;
        }
        
        try {
          if (window.harmonyBridge && typeof window.harmonyBridge.showToast === 'function') {
            window.harmonyBridge.showToast(message);
            showResult('自定义提示已发送: ' + message);
          } else {
            showResult('错误: JSBridge未注册或showToast方法不可用');
          }
        } catch (error) {
          showResult('显示自定义提示失败: ' + error.message);
        }
      }

      // 获取可用方法
      function getAvailableMethods() {
        try {
          if (window.harmonyBridge && typeof window.harmonyBridge.getMethods === 'function') {
            const result = window.harmonyBridge.getMethods();
            if (result && result.methods) {
              let methodsText = '=== 可用JSBridge方法 ===\n\n';
              result.methods.forEach(method => {
                methodsText += '• ' + method.name + ': ' + method.description + '\n';
              });
              showResult(methodsText);
            } else {
              showResult('获取方法列表失败');
            }
          } else {
            showResult('错误: JSBridge未注册或getMethods方法不可用');
          }
        } catch (error) {
          showResult('获取方法列表失败: ' + error.message);
        }
      }

      // 显示结果
      function showResult(text) {
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = text;
        resultDiv.style.backgroundColor = '#fff3cd';
        resultDiv.style.borderColor = '#ffeaa7';

        // 3秒后恢复原样
        setTimeout(() => {
          resultDiv.style.backgroundColor = 'white';
          resultDiv.style.borderColor = '#ddd';
        }, 3000);
      }

      // 页面加载完成后检查JSBridge是否可用
      window.addEventListener('load', function() {
        setTimeout(() => {
          if (window.harmonyBridge) {
            showResult('JSBridge已就绪！可以使用以下功能：\n1. 测试JSBridge连接\n2. 获取设备信息\n3. 显示鸿蒙提示\n4. 获取可用方法');
            // 自动测试连接
            testJSBridge();
          } else {
            showResult('警告: JSBridge未检测到，请确保鸿蒙端已正确注册JavaScript代理');
            console.log('页面加载完成，window.harmonyBridge:', window.harmonyBridge);
          }
        }, 1500); // 增加延迟，确保JSBridge已注册
      });

      // 原始按钮功能
      document.getElementById('button01').addEventListener('click', function() {
        getDeviceInfo();
      });

      document.getElementById('button02').addEventListener('click', function() {
        const message = document.getElementById('textarea02').value;
        if (message) {
          if (window.harmonyBridge && typeof window.harmonyBridge.showToast === 'function') {
            window.harmonyBridge.showToast(message);
            showResult('消息已发送到鸿蒙终端: ' + message);
          } else {
            showResult('错误: JSBridge未注册或showToast方法不可用');
          }
        } else {
          showResult('请输入要发送的消息');
        }
      });

      // 添加测试按钮事件监听器
      document.getElementById('button03').addEventListener('click', function() {
        testJSBridge();
      });

      // 电话号码验证功能
      function validatePhoneNumber(phoneNumber) {
        if (!phoneNumber || phoneNumber.trim() === '') {
          return { valid: false, message: '电话号码不能为空' };
        }

        // 移除空格、括号、破折号等字符
        const cleanNumber = phoneNumber.replace(/[\s\(\)\-]/g, '');
        
        // 验证手机号（11位，以1开头）
        const mobileRegex = /^1[3-9]\d{9}$/;
        if (mobileRegex.test(cleanNumber)) {
          return { 
            valid: true, 
            message: `手机号验证通过: ${cleanNumber}`,
            formattedNumber: cleanNumber
          };
        }

        // 验证座机号（区号+号码，如010-12345678）
        const landlineRegex = /^(0\d{2,3})(\d{7,8})$/;
        const landlineMatch = cleanNumber.match(landlineRegex);
        if (landlineMatch) {
          return { 
            valid: true, 
            message: `座机号验证通过: ${landlineMatch[1]}-${landlineMatch[2]}`,
            formattedNumber: cleanNumber
          };
        }

        // 验证国际号码（以+开头）
        const internationalRegex = /^\+\d{1,3}\d{5,15}$/;
        if (internationalRegex.test(cleanNumber)) {
          return { 
            valid: true, 
            message: `国际号码验证通过: ${cleanNumber}`,
            formattedNumber: cleanNumber
          };
        }

        // 通用验证（5-20位数字）
        const generalRegex = /^[\d\+]{5,20}$/;
        if (generalRegex.test(cleanNumber)) {
          return { 
            valid: true, 
            message: `电话号码验证通过: ${cleanNumber}`,
            formattedNumber: cleanNumber
          };
        }

        return { 
          valid: false, 
          message: '电话号码格式不正确。请检查：\n1. 手机号：11位，以1开头\n2. 座机号：区号+号码\n3. 国际号码：+国家代码+号码\n4. 仅包含数字、+、-、(、)和空格'
        };
      }

      // 显示电话号码验证结果
      function showPhoneResult(text, isSuccess = true) {
        const resultDiv = document.getElementById('phoneResult');
        resultDiv.textContent = text;
        resultDiv.style.backgroundColor = isSuccess ? '#d4edda' : '#f8d7da';
        resultDiv.style.borderColor = isSuccess ? '#c3e6cb' : '#f5c6cb';
        resultDiv.style.color = isSuccess ? '#155724' : '#721c24';
        resultDiv.style.padding = '10px';
        resultDiv.style.borderRadius = '4px';
        resultDiv.style.marginTop = '10px';
      }

      // 拨打电话功能
      function makePhoneCall() {
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        
        if (!phoneNumber) {
          showPhoneResult('请输入电话号码', false);
          return;
        }

        // 验证电话号码格式
        const validation = validatePhoneNumber(phoneNumber);
        if (!validation.valid) {
          showPhoneResult(validation.message, false);
          return;
        }

        showPhoneResult(`正在验证电话号码: ${phoneNumber}...`, true);

        // 检查JSBridge是否可用
        if (!window.harmonyBridge) {
          showPhoneResult('错误: JSBridge未连接，请等待页面加载完成', false);
          return;
        }

        if (typeof window.harmonyBridge.makeCall !== 'function') {
          showPhoneResult('错误: makeCall方法不可用，请检查鸿蒙端JSBridge配置', false);
          return;
        }

        // 调用鸿蒙端拨打电话功能
        try {
          const result = window.harmonyBridge.makeCall(phoneNumber);
          if (result && result.success) {
            showPhoneResult(`成功: ${result.message}`, true);
          } else {
            showPhoneResult(`失败: ${result ? result.message : '未知错误'}`, false);
          }
        } catch (error) {
          showPhoneResult(`调用拨打电话失败: ${error.message || error}`, false);
        }
      }

      // 验证电话号码功能
      function validatePhone() {
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        
        if (!phoneNumber) {
          showPhoneResult('请输入电话号码', false);
          return;
        }

        const validation = validatePhoneNumber(phoneNumber);
        showPhoneResult(validation.message, validation.valid);
      }

      // 绑定电话号码相关按钮事件
      document.addEventListener('DOMContentLoaded', function() {
        const validateBtn = document.getElementById('validatePhoneBtn');
        const dialBtn = document.getElementById('dialPhoneBtn');
        
        if (validateBtn) {
          validateBtn.addEventListener('click', validatePhone);
        }
        
        if (dialBtn) {
          dialBtn.addEventListener('click', makePhoneCall);
        }

        // 添加回车键支持
        const phoneInput = document.getElementById('phoneNumber');
        if (phoneInput) {
          phoneInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
              makePhoneCall();
            }
          });
        }
      });
    </script>
  </body>
</html>
